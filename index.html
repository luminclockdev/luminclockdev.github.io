<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>street Simulator - Mobile & Shift Controls</title>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; -webkit-user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; touch-action: none; }
        
        canvas { display: block; width: 100vw; height: calc(100vh - 220px); }

        #dashboard {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 220px;
            background: #2a2a2a; border-top: 3px solid #111;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            z-index: 10; display: flex; justify-content: center; align-items: center;
        }

        .car-hood {
            position: absolute; top: -35px; left: 5%; width: 90%; height: 60px;
            background: #d35400; border-radius: 50% 50% 0 0; z-index: 11;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.6); border-top: 2px solid #e67e22;
        }

        .dash-layout {
            position: relative; z-index: 12; width: 100%; max-width: 1200px; height: 100%;
            display: flex; justify-content: space-between; align-items: center; padding: 0 40px;
        }

        .left-vents { display: flex; flex-direction: column; gap: 10px; }
        .vent {
            width: 60px; height: 70px; background: #111; border: 3px solid #444; border-radius: 5px;
            display: flex; flex-direction: column; justify-content: space-evenly; padding: 5px;
            box-shadow: inset 0 0 10px #000;
        }
        .vent-line { width: 100%; height: 4px; background: #333; }

        .center-cluster { display: flex; align-items: center; gap: 40px; }
        
        .dial-container { position: relative; width: 140px; height: 140px; }
        .dial {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at center, #1a1a1a, #050505);
            border: 8px solid #b87333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,1);
            position: relative;
        }
        .dial-label { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; font-weight: bold; }
        
        .needle {
            position: absolute; bottom: 50%; left: 50%;
            width: 4px; height: 55px; background: #e74c3c;
            transform-origin: bottom center; transform: translateX(-50%) rotate(-130deg);
            transition: transform 0.1s linear; border-radius: 4px 4px 0 0;
            box-shadow: 0 0 5px #000;
        }
        .needle-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 20px; height: 20px; background: #111; border: 2px solid #555; border-radius: 50%;
        }

        .hazard-btn {
            width: 60px; height: 50px; background: #222; border-radius: 8px; border: 3px solid #444;
            display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 6px #000;
        }
        .hazard-triangle {
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-bottom: 25px solid #a00; transition: 0.2s;
        }
        .hazard-btn:active .hazard-triangle { border-bottom-color: #f00; filter: drop-shadow(0 0 5px #f00); }

        .steering-container { position: relative; width: 180px; height: 180px; }
        .steering-wheel {
            width: 100%; height: 100%; border-radius: 50%;
            border: 18px solid #8b5a2b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.8);
            position: relative; background: transparent; transition: transform 0.1s linear;
        }
        .spoke-left, .spoke-right, .spoke-bottom {
            position: absolute; background: linear-gradient(to right, #aaa, #ddd, #aaa); box-shadow: 0 2px 5px #000;
        }
        .spoke-left { top: 45%; left: -2px; width: 45%; height: 20px; clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 80%); }
        .spoke-right { top: 45%; right: -2px; width: 45%; height: 20px; clip-path: polygon(0 0, 100% 20%, 100% 80%, 0 100%); }
        .spoke-bottom { bottom: -2px; left: 45%; width: 20px; height: 45%; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); background: linear-gradient(to bottom, #aaa, #ddd, #aaa); }
        
        .steering-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 65px; height: 65px; background: radial-gradient(circle, #005c99, #002d4d);
            border-radius: 50%; border: 3px solid #silver; box-shadow: 0 5px 10px rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center; z-index: 2;
        }
        .steering-logo { color: white; font-weight: 900; font-size: 24px; font-style: italic; opacity: 0.8; }

        /* --- CONTROLS & HUD --- */
        .hud-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        
        .pedal {
            position: absolute; bottom: 230px; pointer-events: auto;
            background: linear-gradient(to bottom, #444, #111); border: 2px solid #777; border-radius: 5px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.8); cursor: pointer; transition: 0.1s;
            display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 11px; text-shadow: 0 0 2px #000; text-align: center;
        }
        .pedal:active, .pedal.pressed { transform: translateY(10px) rotateX(15deg); box-shadow: 0 2px 5px rgba(0,0,0,0.9); background: linear-gradient(to bottom, #333, #000); }
        .pedal-clutch { left: 40px; width: 60px; height: 90px; }
        .pedal-brake { right: 120px; width: 80px; height: 70px; }
        .pedal-gas { right: 30px; width: 60px; height: 120px; }

        .shifter-ui {
            position: absolute; right: 30px; bottom: 370px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 2px solid #444;
        }
        .shifter-ui button {
            background: #222; border: 1px solid #555; color: white; padding: 6px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px;
        }
        .shifter-ui button:active { background: #00e676; color: #000; }
        .current-gear { text-align: center; font-size: 26px; font-weight: 900; color: #00e676; margin: 2px 0; }

        /* Mobile Touch Controls Overlay */
        .mobile-controls {
            position: absolute; inset: 0; pointer-events: none; display: none; z-index: 15;
        }
        @media (pointer: coarse) { .mobile-controls { display: block; } }
        
        .mob-btn {
            position: absolute; bottom: 230px; width: 65px; height: 65px; background: rgba(0,0,0,0.6);
            border: 2px solid #666; border-radius: 50%; pointer-events: auto; color: white; font-size: 20px;
            font-weight: bold; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .mob-btn:active { background: rgba(0,230,118,0.4); border-color: #00e676; }
        #mobLeft { left: 20px; bottom: 270px; }
        #mobRight { left: 95px; bottom: 270px; }

        .top-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
        .toggle-btn {
            background: #222; border: 2px solid #555; padding: 8px 15px; border-radius: 20px; color: #aaa;
            font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .toggle-btn.active { background: #002a11; border-color: #00e676; color: #00e676; box-shadow: 0 0 10px rgba(0,230,118,0.5); }
        .toggle-btn.alert { background: #3a0000; border-color: #ff3b30; color: #ff3b30; box-shadow: 0 0 10px rgba(255,59,48,0.5); }

        #warningToast {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9); color: white; padding: 12px 25px; border-radius: 30px;
            font-weight: bold; font-size: 16px; display: none; z-index: 20; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.5);
            text-transform: uppercase; text-align: center;
        }
        #modalOverlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        #startBtn { padding: 15px 50px; font-size: 22px; font-weight: bold; background: #d35400; border: 2px solid #e67e22; border-radius: 8px; cursor: pointer; color: #fff; margin-top: 20px; transition: 0.2s; }
        #startBtn:hover { background: #e67e22; box-shadow: 0 0 15px #d35400; }
    </style>
</head>
<body>

<div id="warningToast">TAKE FOOT OFF GAS!</div>
<canvas id="gameCanvas"></canvas>

<div class="hud-overlay">
    <div class="top-bar">
        <div class="toggle-btn" id="btnTrans" onclick="toggleTransmission()">MODE: AUTO</div>
        <div class="toggle-btn alert" id="btnHandbrake" onclick="toggleHandbrake()">HANDBRAKE [Space]</div>
        <div class="toggle-btn alert" id="btnSeatbelt" onclick="toggleSeatbelt()">SEATBELT [B]</div>
    </div>

    <div class="shifter-ui" id="shifterUI" style="display: none;">
        <div style="font-size: 10px; color: #888; text-align: center;">Hold [Shift] + Key</div>
        <button onclick="uiSetGear(6)">6</button>
        <button onclick="uiSetGear(5)">5</button>
        <button onclick="uiSetGear(4)">4</button>
        <button onclick="uiSetGear(3)">3</button>
        <button onclick="uiSetGear(2)">2</button>
        <button onclick="uiSetGear(1)">1</button>
        <div class="current-gear" id="gearDisplay">N</div>
        <button onclick="uiSetGear(0)">N [0]</button>
        <button onclick="uiSetGear(-1)">R</button>
    </div>

    <div class="pedal pedal-clutch" id="uiClutch" style="display: none;">CLUTCH<br>[Shift]</div>
    <div class="pedal pedal-brake" id="uiBrake">BRAKE<br>[S]</div>
    <div class="pedal pedal-gas" id="uiGas">GAS<br>[W]</div>
</div>

<div class="mobile-controls">
    <div class="mob-btn" id="mobLeft">◄</div>
    <div class="mob-btn" id="mobRight">►</div>
</div>

<div id="dashboard">
    <div class="car-hood"></div>
    <div class="dash-layout">
        <div class="left-vents">
            <div class="vent"><div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div></div>
            <div class="vent"><div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div></div>
        </div>

        <div class="center-cluster">
            <div class="dial-container">
                <div class="dial">
                    <div class="needle" id="needleSpeed"></div>
                    <div class="needle-center"></div>
                    <div class="dial-label">MPH</div>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; align-items:center; gap: 15px;">
                <div style="display:flex; gap: 20px; font-size: 24px; font-weight: bold; color: #333;">
                    <span id="indLeft">◄</span>
                    <span id="indRight">►</span>
                </div>
                <div class="hazard-btn" onclick="toggleHazard()">
                    <div class="hazard-triangle" id="hazardIcon"></div>
                </div>
                <div style="font-size:10px; color:#666;">Steering: A / D</div>
            </div>

            <div class="dial-container">
                <div class="dial">
                    <div class="needle" id="needleRPM"></div>
                    <div class="needle-center"></div>
                    <div class="dial-label">RPM x1000</div>
                </div>
            </div>
        </div>

        <div class="steering-container">
            <div class="steering-wheel" id="steeringWheel">
                <div class="spoke-left"></div>
                <div class="spoke-right"></div>
                <div class="spoke-bottom"></div>
                <div class="steering-hub"><div class="steering-logo">D</div></div>
            </div>
        </div>
    </div>
</div>

<div id="modalOverlay">
    <h1 style="color: #d35400; font-size: 40px; margin:0; text-align:center;">STREET SIMULATOR</h1>
    <p style="color: #ccc; text-align: center; max-width: 600px; font-size: 16px; padding: 0 20px;">Manual Shifting (Hold Shift + Number) • Touch & Mobile Support</p>
    <button id="startBtn" onclick="startGame()">START ENGINE</button>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const needleSpeed = document.getElementById("needleSpeed");
    const needleRPM = document.getElementById("needleRPM");
    const steeringWheel = document.getElementById("steeringWheel");
    const uiGas = document.getElementById("uiGas");
    const uiBrake = document.getElementById("uiBrake");
    const uiClutch = document.getElementById("uiClutch");
    const shifterUI = document.getElementById("shifterUI");
    const gearDisplay = document.getElementById("gearDisplay");
    
    const btnTrans = document.getElementById("btnTrans");
    const btnHandbrake = document.getElementById("btnHandbrake");
    const btnSeatbelt = document.getElementById("btnSeatbelt");
    const indLeft = document.getElementById("indLeft");
    const indRight = document.getElementById("indRight");
    const warningToast = document.getElementById("warningToast");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 220;
    }
    window.addEventListener("resize", resize);
    resize();

    // Audio Engine
    let audioCtx = null;
    let engineOsc = null;
    let engineGain = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        engineOsc = audioCtx.createOscillator();
        engineOsc.type = "sawtooth";
        engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);

        let filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(300, audioCtx.currentTime);

        engineGain = audioCtx.createGain();
        engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

        engineOsc.connect(filter);
        filter.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === "shift") {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === "click") {
            osc.type = "square";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
    }

    const GRID_SIZE = 1200;
    const ROAD_WIDTH = 220;
    const HALF_ROAD = ROAD_WIDTH / 2;
    
    let car = { x: 55, y: 0, width: 38, height: 74, angle: 0, speed: 0, wheelAngle: 0, rpm: 1000 };
    let isManual = false;
    let gear = 1;
    const gearRatios = { "-1": 15, "0": 0, "1": 15, "2": 30, "3": 50, "4": 75, "5": 105, "6": 135 };
    
    let handbrakeOn = true;
    let seatbeltOn = false;
    let indicatorState = 0;
    let blinkTick = false;
    let warningTimer = null;
    let gameRunning = false;
    let keys = {};
    let traffic = [];

    // Mobile inputs state
    let touchControl = { gas: false, brake: false, clutch: false, left: false, right: false };

    function pseudoRandom(x, y) {
        let h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return h - Math.floor(h);
    }

    function showWarning(msg, color = "#ff3b30") {
        warningToast.innerText = msg;
        warningToast.style.background = color;
        warningToast.style.display = "block";
        clearTimeout(warningTimer);
        warningTimer = setTimeout(() => { warningToast.style.display = "none"; }, 1500);
    }

    function toggleHandbrake() {
        handbrakeOn = !handbrakeOn;
        btnHandbrake.className = handbrakeOn ? "toggle-btn alert" : "toggle-btn";
        playSound("click");
    }

    function toggleSeatbelt() {
        seatbeltOn = !seatbeltOn;
        btnSeatbelt.className = seatbeltOn ? "toggle-btn active" : "toggle-btn alert";
        if(seatbeltOn) showWarning("SEATBELT FASTENED", "#00e676");
        playSound("click");
    }

    function toggleTransmission() {
        isManual = !isManual;
        btnTrans.innerText = isManual ? "MODE: MANUAL" : "MODE: AUTO";
        btnTrans.className = isManual ? "toggle-btn active" : "toggle-btn";
        uiClutch.style.display = isManual ? "flex" : "none";
        shifterUI.style.display = isManual ? "flex" : "none";
        gear = isManual ? 1 : 1; 
        updateGearDisplay();
        playSound("click");
    }

    function toggleHazard() { indicatorState = indicatorState === 2 ? 0 : 2; playSound("click"); }

    function setGear(targetGear) {
        let gasPressed = keys["KeyW"] || keys["ArrowUp"] || touchControl.gas;
        if (gasPressed) {
            showWarning("TAKE FOOT OFF GAS!");
            return;
        }
        gear = targetGear;
        updateGearDisplay();
        playSound("shift");
    }

    function uiSetGear(targetGear) {
        setGear(targetGear);
    }

    function updateGearDisplay() {
        if (gear === 0) gearDisplay.innerText = "N";
        else if (gear === -1) gearDisplay.innerText = "R";
        else gearDisplay.innerText = gear;
    }

    // Keyboard controls mapping
    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (e.code === "Space" && !e.repeat) toggleHandbrake();
        if (e.code === "KeyB" && !e.repeat) toggleSeatbelt();

        if (isManual && (e.code.startsWith("Digit") || e.code === "KeyR")) {
            let shiftHeld = keys["ShiftLeft"] || keys["ShiftRight"];
            if (!shiftHeld) {
                showWarning("HOLD SHIFT KEY TO CHANGE GEARS!");
                return;
            }
            if (e.code === "Digit0") setGear(0);
            if (e.code === "KeyR") setGear(-1);
            if (e.code === "Digit1") setGear(1);
            if (e.code === "Digit2") setGear(2);
            if (e.code === "Digit3") setGear(3);
            if (e.code === "Digit4") setGear(4);
            if (e.code === "Digit5") setGear(5);
            if (e.code === "Digit6") setGear(6);
        }
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    // Touch event binders for mobile layout
    function bindTouch(elem, prop) {
        elem.addEventListener("touchstart", (e) => { e.preventDefault(); touchControl[prop] = true; });
        elem.addEventListener("touchend", (e) => { e.preventDefault(); touchControl[prop] = false; });
    }
    window.addEventListener("DOMContentLoaded", () => {
        bindTouch(uiGas, "gas");
        bindTouch(uiBrake, "brake");
        bindTouch(uiClutch, "clutch");
        bindTouch(document.getElementById("mobLeft"), "left");
        bindTouch(document.getElementById("mobRight"), "right");
    });

    function startGame() {
        initAudio();
        car.x = 55; car.y = 0; car.angle = 0; car.speed = 0; car.rpm = 1000;
        initTraffic();
        gameRunning = true;
        document.getElementById("modalOverlay").style.display = "none";
        setInterval(() => { blinkTick = !blinkTick; }, 400);
    }

    function initTraffic() {
        traffic = [];
        for(let i=0; i<12; i++) spawnNPC();
    }

    function spawnNPC() {
        let isVert = Math.random() < 0.5;
        let gx = Math.floor((Math.random()-0.5)*5) * GRID_SIZE;
        let gy = Math.floor((Math.random()-0.5)*5) * GRID_SIZE;
        let dir = Math.random() < 0.5 ? 1 : -1;
        
        traffic.push({
            x: isVert ? gx + (dir===1?55:-55) : gx + (Math.random()*1600-800),
            y: !isVert ? gy + (dir===1?-55:55) : gy + (Math.random()*1600-800),
            angle: isVert ? (dir===1?0:Math.PI) : (dir===1?Math.PI/2:-Math.PI/2),
            speed: 3 + Math.random()*2,
            width: 36, height: 68,
            color: `hsl(${Math.floor(Math.random()*360)}, 65%, 45%)`
        });
    }

    function update() {
        if (!gameRunning) return;

        let gas = keys["KeyW"] || keys["ArrowUp"] || touchControl.gas;
        let brake = keys["KeyS"] || keys["ArrowDown"] || touchControl.brake;
        let clutch = keys["ShiftLeft"] || keys["ShiftRight"] || touchControl.clutch;
        let left = keys["KeyA"] || keys["ArrowLeft"] || touchControl.left;
        let right = keys["KeyD"] || keys["ArrowRight"] || touchControl.right;

        uiGas.className = gas ? "pedal pedal-gas pressed" : "pedal pedal-gas";
        uiBrake.className = brake ? "pedal pedal-brake pressed" : "pedal pedal-brake";
        if(isManual) uiClutch.className = clutch ? "pedal pedal-clutch pressed" : "pedal pedal-clutch";

        let targetWheel = 0;
        if (left) targetWheel = -0.55;
        if (right) targetWheel = 0.55;
        car.wheelAngle += (targetWheel - car.wheelAngle) * 0.15;
        steeringWheel.style.transform = `rotate(${car.wheelAngle * 90}deg)`;

        if (handbrakeOn) {
            car.speed *= 0.85;
            car.rpm = gas ? Math.min(car.rpm + 500, 7000) : Math.max(car.rpm - 200, 1000);
        } else {
            if (isManual) {
                let maxSpeed = gearRatios[gear.toString()];
                if (clutch || gear === 0) {
                    car.speed *= 0.99;
                    if (gas) car.rpm = Math.min(car.rpm + 600, 7500);
                    else car.rpm = Math.max(car.rpm - 300, 1000);
                } else {
                    if (gear > 0) {
                        if (gas && car.speed < maxSpeed) car.speed += 0.15;
                        else if (brake) car.speed -= 0.4;
                        else car.speed *= 0.985;
                        car.rpm = 1000 + (Math.abs(car.speed) / maxSpeed) * 6000;
                    } else if (gear === -1) {
                        if (gas && car.speed > -maxSpeed) car.speed -= 0.15;
                        else if (brake) car.speed += 0.4;
                        else car.speed *= 0.985;
                        car.rpm = 1000 + (Math.abs(car.speed) / maxSpeed) * 6000;
                    }
                }
            } else {
                // Automatic Transmission with realistic shift points & shift sounds
                let spd = Math.abs(car.speed);
                let oldGear = gear;
                if (spd < 8) gear = 1;
                else if (spd < 18) gear = 2;
                else if (spd < 32) gear = 3;
                else if (spd < 50) gear = 4;
                else if (spd < 70) gear = 5;
                else gear = 6;

                if (gear !== oldGear) playSound("shift");

                let maxSpeed = gearRatios[gear.toString()];
                if (gas) car.speed = Math.min(car.speed + 0.15, 28);
                else if (brake) car.speed = Math.max(car.speed - 0.4, -6);
                else car.speed *= 0.98;

                gearDisplay.innerText = car.speed < -0.1 ? "R" : gear;
                car.rpm = 1000 + (spd / maxSpeed) * 5000 + (gas ? 800 : 0);
            }
        }

        if (car.speed > 0 && brake && !isManual) car.speed *= 0.95;
        
        if (Math.abs(car.speed) > 0.1) {
            let dir = car.speed > 0 ? 1 : -1;
            car.angle += car.wheelAngle * 0.045 * dir * (Math.abs(car.speed) / 10);
        }
        
        car.x += Math.sin(car.angle) * car.speed;
        car.y -= Math.cos(car.angle) * car.speed;

        if (engineOsc && audioCtx) {
            engineOsc.frequency.setTargetAtTime(40 + (car.rpm / 18), audioCtx.currentTime, 0.05);
            engineGain.gain.setTargetAtTime(gas ? 0.08 : 0.03, audioCtx.currentTime, 0.05);
        }

        let displaySpeed = Math.floor(Math.abs(car.speed) * 4.5);
        let speedAngle = -130 + (displaySpeed * 2); 
        needleSpeed.style.transform = `translateX(-50%) rotate(${Math.min(speedAngle, 130)}deg)`;
        
        let rpmAngle = -130 + ((car.rpm / 8000) * 260);
        needleRPM.style.transform = `translateX(-50%) rotate(${Math.min(rpmAngle, 130)}deg)`;

        indLeft.style.color = (blinkTick && (indicatorState === -1 || indicatorState === 2)) ? "#00e676" : "#333";
        indRight.style.color = (blinkTick && (indicatorState === 1 || indicatorState === 2)) ? "#00e676" : "#333";

        traffic.forEach(npc => {
            let dx = car.x - npc.x, dy = car.y - npc.y;
            if (Math.hypot(dx, dy) > 2000) {
                npc.x = car.x + (Math.random()*1500 - 750);
                npc.y = car.y + (Math.random()*1500 - 750);
            }
            let fX = npc.x + Math.sin(npc.angle) * 80;
            let fY = npc.y - Math.cos(npc.angle) * 80;
            if (Math.hypot(car.x - fX, car.y - fY) < 70) npc.speed *= 0.8;
            else npc.speed = Math.min(npc.speed + 0.1, 4);
            npc.x += Math.sin(npc.angle) * npc.speed;
            npc.y -= Math.cos(npc.angle) * npc.speed;
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height * 0.75);
        ctx.rotate(-car.angle);
        ctx.translate(-car.x, -car.y);

        let sGX = Math.floor((car.x - 1500) / GRID_SIZE) * GRID_SIZE;
        let eGX = Math.ceil((car.x + 1500) / GRID_SIZE) * GRID_SIZE;
        let sGY = Math.floor((car.y - 1500) / GRID_SIZE) * GRID_SIZE;
        let eGY = Math.ceil((car.y + 1500) / GRID_SIZE) * GRID_SIZE;

        for (let gx = sGX; gx <= eGX; gx += GRID_SIZE) {
            for (let gy = sGY; gy <= eGY; gy += GRID_SIZE) {
                let rand = pseudoRandom(gx/GRID_SIZE, gy/GRID_SIZE);
                let bX = gx + HALF_ROAD, bY = gy + HALF_ROAD, bW = GRID_SIZE - ROAD_WIDTH;

                ctx.fillStyle = "#2ecc71"; ctx.fillRect(bX, bY, bW, bW);

                if (rand < 0.6) {
                    ctx.fillStyle = rand < 0.3 ? "#34495e" : (rand < 0.45 ? "#7f8c8d" : "#9b59b6");
                    ctx.strokeStyle = "#222"; ctx.lineWidth = 4;
                    let sw = bW/2 - 40;
                    ctx.fillRect(bX+20, bY+20, sw, sw); ctx.strokeRect(bX+20, bY+20, sw, sw);
                    ctx.fillRect(bX+sw+60, bY+20, sw, sw); ctx.strokeRect(bX+sw+60, bY+20, sw, sw);
                    ctx.fillRect(bX+20, bY+sw+60, sw, sw); ctx.strokeRect(bX+20, bY+sw+60, sw, sw);
                } else {
                    for(let i=0; i<15; i++){
                        let tx = bX + 30 + pseudoRandom(rand, i) * (bW - 60);
                        let ty = bY + 30 + pseudoRandom(i, rand) * (bW - 60);
                        ctx.fillStyle = "#27ae60";
                        ctx.beginPath(); ctx.arc(tx, ty, 15 + pseudoRandom(tx,ty)*12, 0, Math.PI*2); ctx.fill();
                    }
                }

                ctx.fillStyle = "#34495e";
                ctx.fillRect(gx - HALF_ROAD, gy - 2000, ROAD_WIDTH, 4000);
                ctx.fillRect(gx - 2000, gy - HALF_ROAD, 4000, ROAD_WIDTH);

                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3; ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(gx-3, gy-2000); ctx.lineTo(gx-3, gy+2000); ctx.moveTo(gx+3, gy-2000); ctx.lineTo(gx+3, gy+2000);
                ctx.moveTo(gx-2000, gy-3); ctx.lineTo(gx+2000, gy-3); ctx.moveTo(gx-2000, gy+3); ctx.lineTo(gx+2000, gy+3); ctx.stroke();
                
                ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.setLineDash([20, 20]);
                ctx.beginPath(); ctx.moveTo(gx-HALF_ROAD/2, gy-2000); ctx.lineTo(gx-HALF_ROAD/2, gy+2000); ctx.moveTo(gx+HALF_ROAD/2, gy-2000); ctx.lineTo(gx+HALF_ROAD/2, gy+2000);
                ctx.moveTo(gx-2000, gy-HALF_ROAD/2); ctx.lineTo(gx+2000, gy-HALF_ROAD/2); ctx.moveTo(gx-2000, gy+HALF_ROAD/2); ctx.lineTo(gx+2000, gy+HALF_ROAD/2); ctx.stroke(); ctx.setLineDash([]);
            }
        }

        traffic.forEach(npc => {
            ctx.save(); ctx.translate(npc.x, npc.y); ctx.rotate(npc.angle);
            ctx.fillStyle = npc.color; ctx.fillRect(-npc.width/2, -npc.height/2, npc.width, npc.height);
            ctx.fillStyle = "#111"; ctx.fillRect(-npc.width/2+4, -npc.height/2+10, npc.width-8, 12); ctx.fillRect(-npc.width/2+4, npc.height/2-15, npc.width-8, 8);
            ctx.restore();
        });

        ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
        ctx.fillStyle = "#000";
        ctx.save(); ctx.translate(-car.width/2-1, -car.height/2+15); ctx.rotate(car.wheelAngle); ctx.fillRect(-3, -8, 6, 16); ctx.restore();
        ctx.save(); ctx.translate(car.width/2+1, -car.height/2+15); ctx.rotate(car.wheelAngle); ctx.fillRect(-3, -8, 6, 16); ctx.restore();
        ctx.fillRect(-car.width/2-2, car.height/2-20, 5, 16); ctx.fillRect(car.width/2-3, car.height/2-20, 5, 16);
        ctx.fillStyle = "#d35400";
        ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
        ctx.fillStyle = "#111";
        ctx.fillRect(-car.width/2+4, -car.height/2+18, car.width-8, 16); ctx.fillRect(-car.width/2+4, car.height/2-22, car.width-8, 8);

        if (blinkTick) {
            ctx.fillStyle = "#ff9800";
            if (indicatorState === -1 || indicatorState === 2) { ctx.fillRect(-car.width/2, -car.height/2, 6, 6); ctx.fillRect(-car.width/2, car.height/2-6, 6, 6); }
            if (indicatorState === 1 || indicatorState === 2) { ctx.fillRect(car.width/2-6, -car.height/2, 6, 6); ctx.fillRect(car.width/2-6, car.height/2-6, 6, 6); }
        }
        
        if (keys["KeyS"] || keys["ArrowDown"] || touchControl.brake || handbrakeOn) {
            ctx.fillStyle = "#ff0000"; ctx.fillRect(-car.width/2+2, car.height/2-4, 10, 4); ctx.fillRect(car.width/2-12, car.height/2-4, 10, 4);
        }
        ctx.restore();
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
</script>
